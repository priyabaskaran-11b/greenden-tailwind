<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeden - Contact</title>

    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body>

    <!-- Navbar -->
    <nav class="bg-green-100 p-3 flex items-center justify-between shadow-xl sticky top-0 z-10">
        <h1 class="text-2xl">Greeden</h1>

        <ul class="flex gap-5 text-gray-600 hidden md:flex">
            <li><a class="hover:underline hover:text-black" href="index.html">Home</a></li>
            <li><a class="hover:underline hover:text-black" href="product.html">Products</a></li>
            <li><a class="font-bold text-black" href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <!-- Banner -->
    <div class="bg-green-200 text-center p-6 mt-5 mx-5 rounded">
        <h1 class="text-2xl font-bold">📞 Get in Touch</h1>
        <p>We’d love to hear from you. Send us your queries anytime!</p>
    </div>

    <!-- Contact Section -->
    <section class="p-5 flex justify-center">
        <div class="bg-white shadow-xl rounded-lg p-8 w-full max-w-lg">

            <h2 class="text-3xl font-bold text-center mb-6">Contact Us</h2>

            <form class="space-y-5">

                <!-- Email -->
                <div>
                    <label class="block mb-1 text-sm font-medium text-gray-700">Your Email</label>
                    <input type="email" placeholder="name@gmail.com"
                        class="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-green-500">
                </div>

                <!-- Subject -->
                <div>
                    <label class="block mb-1 text-sm font-medium text-gray-700">Subject</label>
                    <input type="text" placeholder="Enter subject"
                        class="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-green-500">
                </div>

                <!-- Message -->
                <div>
                    <label class="block mb-1 text-sm font-medium text-gray-700">Your Message</label>
                    <textarea rows="5" placeholder="Write your message..."
                        class="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-green-500"></textarea>
                </div>

                <!-- Button -->
                <button type="submit"
                    class="w-full bg-green-700 text-white py-3 rounded-lg hover:bg-green-800 transition">
                    Send Message
                </button>

            </form>
        </div>
    </section>

    <!-- Footer -->
    <section class="bg-green-100 p-10 flex flex-col gap-5">
        <h1 class="text-4xl font-bold">Greeden</h1>
        <p>The standard chunk of lorem ipsum used since the 1500s is reproduced below for those interested</p>
        <p>@ 2021 Greenday.com</p>
    </section>

</body>
</html>
